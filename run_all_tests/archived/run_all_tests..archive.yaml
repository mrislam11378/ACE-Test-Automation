- name: Archive test results
  become: true
  become_user: "{{ mqm_user }}"
  ansible.builtin.archive:
    format: zip
    dest: "{{ archive_path }}/{{ broker_name }}_{{ eg_name }}_{{ run_timestamp }}_archive.zip"
    path: "{{ log_dir_base }}/*"
  register: zip_result

- debug: msg="{{ zip_result }}"

- name: Email the summary report
  mail:
    host: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    from: "{{ email_from }}"
    subject: "{{ email_subject }}"
    to: "{{ to_emails }}"
    cc: "{{ cc_emails }}"
    body: "{{ email_body }}"
    attach: 
      - "{{ summary_file_path }}"
      - "{{ archive_path }}/{{ broker_name }}_{{ eg_name }}_{{ run_timestamp }}_archive.zip"

  ignore_errors: yes

