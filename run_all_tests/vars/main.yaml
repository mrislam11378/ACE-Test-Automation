---
mqm_user: "mqm"
mqm_group: "mqm"
env_name: "intg"

# Survey variables
broker_name: "TestNode"
eg_name: "TestServer"
qm_name: "MYQMGR"
ace_version: "12.0.12.22"
to_emails: ""        # Leave empty to skip email notification
cc_emails: []        # Optional - List of CC recipients, e.g., ["manager@example.com", "techlead@example.com"]
cleanup_log: false  # Set to true to clean log directory before each test run
# delete_dsn_before_start: true  # WARNING: Deletes DSN directory before starting server

# Log Directory
log_dir_base: "/{{ env_name }}mqm/recorded_messages/logs"
archive_path: "/{{ env_name }}mqm/recorded_messages"

# Email configuration
smtp_host: "smtp-out.nfcu.net"
smtp_port: 25
email_from: "MiddlewareWeb@navyfederal.org"

# ODBC configuration
odbcsysini: "/opt/ace/commonConfig/unixodbc/"
odbcini: "/opt/ace/commonConfig/unixodbc/odbc.ini"
odbcinstini: "/opt/ace/commonConfig/unixodbc/odbcinst.ini"

# Internal paths - Do not modify unless necessary
ace_profile_path: "/opt/IBM/ace-{{ ace_version }}/server/bin/mqsiprofile"
ace_profile: "[ -f ~/.bash_profile ] && . ~/.bash_profile || . {{ ace_profile_path }}"
mqsi_workpath: "/var/mqsi"
server_dir: "{{ mqsi_workpath }}/components/{{ broker_name }}/servers/{{ eg_name }}"
run_dir: "{{ server_dir }}/run"
dsn_src_path: "{{ mqsi_workpath }}/registry/{{ broker_name }}/CurrentVersion/DSN"
dsn_dest_path: "{{ server_dir }}/config/registry/integration_server/CurrentVersion/DSN"
ace_command: "IntegrationServer --work-dir {{ server_dir }} --no-nodejs --start-msgflows false --mq-queue-manager-name {{ qm_name }}"
 